<div id="screen-end" class="screen">
  <div class="result-card">

    <div class="result-icon" id="end-icon">🏆</div>
    <div class="result-title" id="end-title">¡Misión completada!</div>
    <div class="result-sub" id="end-sub">Resultados de tu partida</div>

    <div class="score-grid">
      <div class="score-box">
        <div class="sb-num" id="res-lvl1">0</div>
        <div class="sb-label">Puntos<br>Nivel 1</div>
      </div>
      <div class="score-box">
        <div class="sb-num" id="res-lvl2">0</div>
        <div class="sb-label">Puntos<br>Nivel 2</div>
      </div>
      <div class="score-box">
        <div class="sb-num" id="res-lvl3">0</div>
        <div class="sb-label">Puntos<br>Nivel 3</div>
      </div>
    </div>

    <div class="total-score">
      <div class="ts-label">Puntaje total</div>
      <div>
        <span class="ts-num" id="end-total">0</span>
        <span class="ts-denom">/ 100</span>
      </div>
    </div>

    <div class="rating-text" id="end-rating"></div>

    <button class="btn btn-restart" onclick="restartGame()">↺ JUGAR DE NUEVO</button>

  </div>
</div>
